{% extends 'gestion/base.html' %}
{% block title %}Eliminar Libro{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card border-danger">
            <div class="card-header bg-danger text-white"><h4 class="mb-0"><i class="bi bi-exclamation-triangle"></i> Confirmar eliminación</h4></div>
            <div class="card-body text-center p-4">
                <i class="bi bi-trash" style="font-size:3rem;color:#dc3545;"></i>
                <h5 class="mt-3">¿Desea eliminar el libro?</h5>
                <p class="text-muted"><strong>{{ libro.titulo }}</strong><br>{{ libro.autor.nombre }} ({{ libro.genero }})</p>
                <form method="post" class="d-flex gap-2 justify-content-center mt-3">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger"><i class="bi bi-trash"></i> Sí, eliminar</button>
                    <a href="{% url 'lista_libros' %}" class="btn btn-secondary"><i class="bi bi-x-circle"></i> Cancelar</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
